[package]
name = "aiimage"
version = "0.1.0"
edition = "2021"

# HTTP WebDriver is opt-in and is never linked into ordinary production builds.
# Do not enable the feature in an installer / normal release build.
[features]
default = []
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "aiimage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
png = "0.18"
crc32fast = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
