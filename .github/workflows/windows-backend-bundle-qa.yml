name: Windows packaged backend QA
on:
  push:
    branches: [feat/m3-39-windows-backend-bundle, feat/m3-40-installed-backend-restart-qa, feat/m3-41-nsis-inplace-repair-qa, feat/m3-42-nsis-version-upgrade-qa, feat/m3-43-nsis-downgrade-guard-qa, feat/m3-44-nsis-preinstall-failure-recovery-qa, feat/m3-45-readonly-ai-runtime-inventory, feat/m3-46-isolated-ai-runtime-plan, chore/m3-final-readiness-audit]
  workflow_dispatch:
  # A label explicitly opts this PR into installing TEST-ONLY unsigned NSIS
  # builds in a disposable hosted Windows runner. Never run this on user PCs.
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: backend-bundle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaged-backend:
    # No automatic installed-app runs on ordinary PR pushes/synchronization.
    # Require same-repository PR + opt-in label, or the existing historical
    # branch push and manual dispatch paths. Unsigned runner artifacts are
    # NOT uploaded, signed, or released by this workflow.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-packaged-backend-qa')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-fund
      - name: Build frozen read-only API with hashed Windows dependencies
        shell: pwsh
        run: ./scripts/build-windows-backend.ps1
      - name: Exercise frozen executable auth, isolated AI runtime setup plan, no-CUDA metadata, EOF and recovery
        shell: pwsh
        run: |
          $env:AIIMAGE_TEST_BACKEND = Join-Path $PWD 'src-tauri/backend-dist/aiimage-backend/aiimage-backend.exe'
          python -m unittest discover -s backend -p test_bundled_server.py -v
          if ($LASTEXITCODE -ne 0) { throw 'frozen_backend_smoke_failed' }
      # The following Rust --lib suite includes a real Python 3.12 child
      # importing model_integrity (Pydantic). The frozen sidecar bundles its
      # own dependencies and does not satisfy the *host* Python test process.
      # This setup runs ONLY in an ephemeral Actions runner after frozen
      # executable validation; it does not install packages on user machines.
      - name: Install host Python test dependencies for native Rust cross-language QA
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'host_python_test_requirements_failed' }
          python -c "import pydantic; from model_integrity import IntegrityEntry" 
        env:
          PYTHONPATH: backend
      - name: Test real Rust manager against the frozen backend
        shell: pwsh
        run: |
          $env:AIIMAGE_TEST_BACKEND = Join-Path $PWD 'src-tauri/backend-dist/aiimage-backend/aiimage-backend.exe'
          cargo build --manifest-path src-tauri/Cargo.toml --example stalled_backend --locked
          if ($LASTEXITCODE -ne 0) { throw 'stalled_fixture_build_failed' }
          $env:AIIMAGE_TEST_STALLED_BACKEND = Join-Path $PWD 'src-tauri/target/debug/examples/stalled_backend.exe'
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --features bundled-backend
          if ($LASTEXITCODE -ne 0) { throw 'rust_suite_failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --features bundled-backend backend_runtime::tests -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'rust_frozen_lifecycle_failed' }
      - name: Verify production dependency isolation
        shell: pwsh
        run: |
          $tree = cargo tree --manifest-path src-tauri/Cargo.toml --locked --features bundled-backend --edges normal
          if ($LASTEXITCODE -ne 0 -or $tree -match 'tauri-plugin-wdio-webdriver') { throw 'production_dependency_isolation_failed' }
          ./scripts/windows-nsis-bundle-qa.ps1
      - name: Build unsigned NSIS with full API payload
        run: npm run tauri -- build --config src-tauri/tauri.backend-qa.conf.json --config src-tauri/tauri.downgrade-guard-qa.conf.json --config src-tauri/tauri.preinstall-fault-qa.conf.json --bundles nsis
      - name: Verify installer and lockfile
        shell: pwsh
        run: |
          ./scripts/windows-nsis-bundle-qa.ps1 -VerifyBundle
          git diff --exit-code -- src-tauri/Cargo.lock package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'lockfile_changed' }
      - name: Keep older unsigned installer solely in disposable runner temp
        shell: pwsh
        run: |
          $folder = Join-Path $PWD 'src-tauri/target/release/bundle/nsis'
          $old = @(Get-ChildItem -LiteralPath $folder -Filter '*setup.exe' -File)
          if ($old.Count -ne 1 -or $old[0].Name -notmatch '0\.1\.0') { throw 'version_upgrade_qa: old_installer_invalid' }
          $destination = Join-Path $env:RUNNER_TEMP 'aiimage-m3-42-original-setup.exe'
          if (Test-Path -LiteralPath $destination) { throw 'version_upgrade_qa: runner_temp_collision' }
          Move-Item -LiteralPath $old[0].FullName -Destination $destination
      - name: Build newer-version unsigned NSIS with identical bundled backend
        run: npm run tauri -- build --config src-tauri/tauri.backend-qa.conf.json --config src-tauri/tauri.downgrade-guard-qa.conf.json --config src-tauri/tauri.preinstall-fault-qa.conf.json --config src-tauri/tauri.upgrade-qa.conf.json --bundles nsis
      - name: Verify newer-version NSIS and lockfile integrity
        shell: pwsh
        run: |
          ./scripts/windows-nsis-bundle-qa.ps1 -VerifyBundle
          git diff --exit-code -- src-tauri/Cargo.lock package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'version_upgrade_qa: lockfile_changed' }
      - name: Installed version upgrade, rejected downgrade, injected preinstall abort, retry, GUI and uninstall QA
        shell: pwsh
        run: ./scripts/windows-installed-backend-qa.ps1 -VerifyTwoVersionUpgrade
      # No artifact upload, release, signing, model download or GPU execution.
