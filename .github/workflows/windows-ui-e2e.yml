name: Windows native UI E2E (opt-in)
on:
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      confirm_release_only:
        description: "I understand this launches ONLY the GPU-disabled Tauri RELEASE UI on a fresh hosted Windows runner."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-windows-ui:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_release_only == true) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-native-ui-e2e')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked JS dependencies
        run: npm ci --no-fund
      - name: Protocol unit smoke (no GUI)
        run: node --test scripts/windows-ui-e2e.test.mjs
      - name: Confirm Rust release uses the tracked Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked > /dev/null
      - name: Compile GPU-disabled Tauri release binary (no installer)
        run: npm run tauri -- build --no-bundle
      - name: Assert release build did not change Cargo.lock
        shell: bash
        run: git diff --exit-code -- src-tauri/Cargo.lock
      - name: Independently probe GPU-disabled release window startup
        shell: pwsh
        env:
          AIIMAGE_E2E_APP: ${{ github.workspace }}\src-tauri\target\release\aiimage.exe
        run: ./scripts/windows-release-window-probe.ps1 -Application $env:AIIMAGE_E2E_APP
      - name: Install native WebDriver (official Tauri documented approach)
        run: cargo install tauri-driver --locked
      - name: Resolve Edge WebDriver for Windows
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Actual native Windows GUI click-through (no GPU consent)
        shell: pwsh
        env:
          AIIMAGE_E2E_APP: ${{ github.workspace }}\src-tauri\target\release\aiimage.exe
        run: node scripts/windows-ui-e2e.mjs --run
