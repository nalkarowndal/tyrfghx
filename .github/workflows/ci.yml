name: CI
on:
  push:
  pull_request:
# Avoid running multiple expensive Windows Rust builds for superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund
      - name: Audit locked JavaScript dependencies (moderate or higher)
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      - name: Test M3-26 W3C WebDriver harness (mock protocol only; no GUI)
        run: node --test scripts/windows-ui-e2e.test.mjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - name: Audit M3-Final release boundaries (static only; no GPU or install)
        run: python scripts/m3_final_gate.py
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - name: Audit M3-Final release boundaries (static only; no GPU or install)
        run: python scripts/m3_final_gate.py
  desktop-rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Use the reviewed committed npm lockfile on both Linux and Windows.
      - run: npm ci --no-fund
      - name: Verify Windows dev launcher without opening a GUI or GPU
        shell: pwsh
        run: ./scripts/test-windows-dev.ps1
      - name: Validate Windows native release probe path guard (no GUI)
        shell: pwsh
        run: ./scripts/windows-release-window-probe.ps1 -Application (Join-Path $PWD.Path "src-tauri/target/release/aiimage.exe") -ValidateOnly
      - name: Check production WebDriver absence probe path policy (no app launch)
        shell: pwsh
        run: ./scripts/windows-production-webdriver-absence.ps1 -Application (Join-Path $PWD.Path "src-tauri/target/release/aiimage.exe") -ValidateOnly
      - name: Check embedded runtime gate path restriction (no GUI)
        shell: pwsh
        run: ./scripts/windows-embedded-runtime-gate.ps1 -Application (Join-Path $PWD.Path "src-tauri/target/release/aiimage.exe") -ValidateOnly
      - name: Validate Windows NSIS QA overlay and production policy (no installer)
        shell: pwsh
        run: ./scripts/windows-nsis-bundle-qa.ps1
      - name: Validate isolated two-version NSIS overlay (no install or GUI)
        shell: pwsh
        run: ./scripts/windows-version-upgrade-config-qa.ps1
      - name: Install backend validation dependencies for cross-language Windows native fixture QA
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Verify Rust toolchain
        run: rustc --version
      - name: Validate committed Rust dependency graph without changing Cargo.lock
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked --features e2e-webdriver --no-deps
      - name: Build and test native import/catalog/hash/generation flows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
