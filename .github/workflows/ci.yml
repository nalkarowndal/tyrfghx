name: CI
on:
  push:
  pull_request:
# Avoid running multiple expensive Windows Rust builds for superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund
      - name: Audit locked JavaScript dependencies (moderate or higher)
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  desktop-rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Use the reviewed committed npm lockfile on both Linux and Windows.
      - run: npm ci --no-fund
      - name: Verify Windows dev launcher without opening a GUI or GPU
        shell: pwsh
        run: ./scripts/test-windows-dev.ps1
      - name: Verify Rust toolchain
        run: rustc --version
      - name: Build and test Tauri native import code
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
